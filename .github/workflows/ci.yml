name: CI

on:
  # bewusst ohne Branch-Filter: läuft auf jedem Push, egal wie der
  # Default-Branch gerade heißt. Die Ergebnisse hängen am Commit und
  # tauchen damit auch in einem PR auf.
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Der Job, dessen Zahl im README steht. Hier ist ALLES installiert — sonst
  # überspringen sich Tests selbst, und die Suite ist grün, weil sie gar nicht
  # gelaufen ist. Vorher gab es zwei Jobs, von denen der eine ohne vpype und
  # der andere ohne NiceGUI lief; die volle Zahl erzeugte keiner von beiden,
  # und der zweite trug `continue-on-error: true`, konnte die CI also nie rot
  # färben.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (alle Extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geometry,web,photo,hatch,dev,site]"

      - name: Lint
        run: ruff check .

      - name: Test
        # Einmal laufen lassen, das Ergebnis danach auswerten. Ein Skip ist in
        # diesem Job kein Freibrief, sondern ein Hinweis: hier ist alles
        # installiert, also darf sich nichts wegen eines fehlenden Pakets
        # überspringen. Genau dadurch war die Suite lange grün, während ganze
        # Testdateien gar nicht liefen.
        #
        # `-rxs` listet auch die xfails — die dürfen bleiben (ein Fremdpaket,
        # das seit Jahren nicht mehr veröffentlicht wurde, repariert sich nicht
        # durch einen roten Balken), sollen aber im Bericht stehen.
        run: |
          set -o pipefail
          pytest -q -rxs 2>&1 | tee ergebnis.txt
          if grep -qiE "^SKIPPED.*(optional|Extra:)" ergebnis.txt; then
            echo "::error::Tests haben sich wegen fehlender Pakete übersprungen"
            grep -iE "^SKIPPED" ergebnis.txt
            exit 1
          fi

  # Der Kern muss auch ohne Extras laufen — wer nur GCode erzeugen will, soll
  # nicht vpype und NiceGUI installieren müssen. Hier dürfen sich Tests
  # überspringen; brechen darf nichts.
  kern-ohne-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (nur Kern)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q -rs

      - name: Konsolenskripte starten
        # Ein Entry-Point, der beim Import stirbt, fällt sonst erst dem
        # Menschen vor der Wand auf.
        run: |
          plot --help > /dev/null
          wallplotter-calibrate --help > /dev/null
          wallplotter-correct --help > /dev/null
          wallplotter-doctor --help > /dev/null
          wallplotter-firmware --help > /dev/null
          wallplotter-kinematics --help > /dev/null
          wallplotter-location --help > /dev/null
          wallplotter-resume --help > /dev/null
          wallplotter-setup --help > /dev/null
          wallplotter-web --help > /dev/null

  # Die ausgelieferte config.yaml gegen zwei Dinge halten: gegen das, was FluidNC
  # wirklich kennt (ein unbekannter Schlüssel setzt das Board in ConfigAlarm), und
  # gegen das, was `wallplotter-firmware` schreiben würde. Läuft das auseinander,
  # beschreiben Software und Board zwei verschiedene Maschinen — und niemand merkt
  # es, bis das Bild an der Wand schief ist.
  firmware-konfiguration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Konfiguration prüfen
        run: pytest -q tests/test_firmware_config.py tests/test_firmware.py

      - name: Erzeugnis auf dem Stand?
        # Dasselbe noch einmal über die CLI, weil genau dieser Aufruf in der
        # Kopfzeile der Datei steht — er soll auch wirklich funktionieren.
        run: |
          wallplotter-firmware pruefen config/fluidnc-wallplotter.yaml
          wallplotter-firmware diff config/fluidnc-wallplotter.yaml --kein-standort

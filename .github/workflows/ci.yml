name: CI

on:
  # bewusst ohne Branch-Filter: läuft auf jedem Push, egal wie der
  # Default-Branch gerade heißt. Die Ergebnisse hängen am Commit und
  # tauchen damit auch in einem PR auf.
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  test-with-vpype:
    # vpype zieht die komplette Geometrie-Toolchain nach; separat, damit ein
    # Bruch dort die schnellen Tests nicht blockiert.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install mit vpype
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geometry,dev]"

      - name: Test
        run: pytest -q

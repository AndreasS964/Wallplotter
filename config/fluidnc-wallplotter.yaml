# FluidNC-Konfiguration für den Wandplotter auf dem BIGTREETECH Rodent V1.0
#
# Pinbelegung (Stepper, SPI, I2S, SD, Endstops) stammt aus BTTs eigener
# rodent.yaml: https://github.com/bigtreetech/Rodent/blob/master/rodent.yaml
# Alles, was dort NICHT drinsteht, ist unten mit PRÜFEN markiert.
#
# Vor dem ersten Einschalten durchgehen:
#   1. Anker-Koordinaten aus der echten Aufhängung eintragen (siehe unten)
#   2. Servo-Pin gegen das Board prüfen — NICHT der PWM-Header, siehe unten
#   3. run_amps auf 1.2 lassen (17HS4412P1-3), nicht höher
#
# Nach dem ersten Einschalten einmalig im FluidNC-Terminal setzen:
#   $HTTP/BlockDuringMotion=OFF
# Ab Werk steht die Sperre an, und dann antwortet /command während jeder
# Fahrt mit HTTP 503 — auch auf harmlose Abfragen. Der WebSocket-Kanal, über
# den diese Software Status, G-Code und Halt schickt, ist davon zwar nicht
# betroffen; die Sperre kostet aber jede Diagnose mit curl oder Browser.
#
# Prüfen lässt sich die Geometrie vorab mit:
#   wallplotter-kinematics --width 2000 --height 2500 --overhang 150 --above 150

board: BTT Rodent V1.0
name: Wandplotter Keller
meta: Kletterwand-Projekt

kinematics:
  WallPlotter:
    # Motorachsen: links hängt an X, rechts an Y
    left_axis: 0
    right_axis: 1

    # STANDORTABHÄNGIG — diese vier Zeilen gehören nicht ins Repo, sondern zur
    # jeweiligen Aufhängung. Der Plotter soll an verschiedenen Wänden hängen,
    # und damit ändern sich Ankerabstand und -höhe jedes Mal.
    #
    # Nach dem Aufhängen drei Maße nehmen (Gondel am Referenzpunkt, G92 gesetzt):
    # Abstand der Umlenkpunkte, linke Riemenlänge, rechte Riemenlänge. Dann:
    #
    #   wallplotter-location new <Name> --span 2300 --left 1450 --right 1470
    #   wallplotter-location config <Name>
    #
    # Das gibt genau diesen Block mit den passenden Zahlen aus. Die Werte unten
    # sind nur ein Beispiel für eine symmetrische Aufhängung.
    left_anchor_x: -1150.000
    left_anchor_y: 900.000
    right_anchor_x: 1150.000
    right_anchor_y: 900.000

    # Länge, in die FluidNC gerade Strecken zerlegt. Kleiner = runder, aber
    # mehr Rechenlast. 1 mm ist bei 2,5 m Wand ein guter Kompromiss.
    segment_length: 1.000

stepping:
  engine: I2S_STREAM
  idle_ms: 255 # Motoren gehalten lassen — die Gondel hängt am Riemen
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 0

axes:
  shared_stepper_disable_pin: NO_PIN

  # Linker Riemen
  x:
    # 20Z-Pulley an GT2 = 40 mm Riemen pro Umdrehung.
    # 200 Vollschritte * 16 Mikroschritte / 40 mm = 80 Schritte/mm
    steps_per_mm: 80.000
    max_rate_mm_per_min: 4000.000
    acceleration_mm_per_sec2: 200.000
    max_travel_mm: 4000.000
    soft_limits: false
    homing:
      # Kein Endschalter. Zwei Wege, und die Wahl entscheidet mehr als sie
      # aussieht — sie bestimmt, ob der Nullpunkt ein Ausschalten übersteht:
      #
      # a) Von Hand: Gondel an den oberen Anschlag fahren, dann G92 setzen
      #    (wallplotter-calibrate zero). Einfach, aber nach jedem Aus- und
      #    Einschalten neu nötig, und ein M2 am Programmende verwirft es laut
      #    GRBL-Konvention ebenfalls.
      #
      # b) Sensorlos per StallGuard: cycle auf 1 setzen, homing_mode auf
      #    CoolStep (siehe unten) und die Empfindlichkeit über stallguard
      #    einstellen. Dann liefert $H reproduzierbare Maschinenkoordinaten,
      #    und der Flächenversatz lässt sich als G54 dauerhaft ablegen
      #    (wallplotter-calibrate zero --persistent). Das ist die Variante,
      #    die mehrfarbige Plots über mehrere Tage trägt.
      cycle: 0
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1.000
      # BTT konfiguriert die TMC2160 des Rodent als tmc_5160 — die Register
      # sind für den Schrittbetrieb identisch, und so ist es von BTT getestet.
      tmc_5160:
        step_pin: I2SO.2
        direction_pin: I2SO.1
        disable_pin: I2SO.0
        cs_pin: gpio.5
        spi_index: 1
        r_sense_ohms: 0.022
        run_amps: 1.200 # Nennstrom der 17HS4412P1-3, nicht erhöhen
        hold_amps: 1.200 # voller Haltestrom: die Gondel darf nicht absacken
        microsteps: 16
        toff_disable: 0
        toff_stealthchop: 5
        use_enable: false
        run_mode: StealthChop # leise; für StallGuard-Homing auf CoolStep wechseln
        homing_mode: CoolStep
        stallguard: 16
        stallguard_debug: false
        toff_coolstep: 3
        tpfd: 4

  # Rechter Riemen
  y:
    steps_per_mm: 80.000
    max_rate_mm_per_min: 4000.000
    acceleration_mm_per_sec2: 200.000
    max_travel_mm: 4000.000
    soft_limits: false
    homing:
      cycle: 0
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1.000
      tmc_5160:
        step_pin: I2SO.5
        direction_pin: I2SO.4
        disable_pin: I2SO.7
        cs_pin: NO_PIN # Daisy-Chain: CS sitzt am ersten Treiber
        spi_index: 2
        r_sense_ohms: 0.022
        run_amps: 1.200
        hold_amps: 1.200
        microsteps: 16
        toff_disable: 0
        toff_stealthchop: 5
        use_enable: false
        run_mode: StealthChop
        homing_mode: CoolStep
        stallguard: 16
        stallguard_debug: false
        toff_coolstep: 3
        tpfd: 4

  # Z bleibt unbenutzt: der Stift hebt über den Servo, nicht über eine Achse.
  # Die beiden freien Treiber (I2SO.10/9/8 und I2SO.13/12/15, spi_index 3 und 4)
  # sind damit Reserve.

# Pen-Lift über Servo am PWM-Ausgang, angesteuert per M3 S<wert> / M5.
# Bewusst NICHT M280 — das ist Marlin/Makelangelo-Konvention und existiert
# in FluidNC nicht.
#
# WICHTIG — der Servo darf NICHT an den PWM-Header des Rodent.
#
# Der Header heißt zwar „PWM (3-10 V)", ist aber gar kein PWM-Ausgang: Laut
# Schaltplan (Blatt 3, „USB_485_PWM") läuft das Signal des ESP32 über ein
# RC-Glied und einen LM358 auf `0_10V_Out`, mit 10-kOhm-Trimmpoti daneben
# (Handbuch 3.6: „SP-PWM potentiometer"). Das ist die analoge
# Drehzahlvorgabe für einen VFD — heraus kommt ein Gleichspannungspegel,
# keine Impulsfolge. Ein RC-Servo braucht genau die Impulsfolge: 50 Hz,
# 1–2 ms Pulsbreite. Am Filter bleibt davon nichts übrig.
#
# Der Servo gehört deshalb an einen GPIO, der roh herausgeführt ist. Am
# leichtesten erreichbar ist der OLED-Header: Er trägt I2C, also gpio.26 und
# gpio.27, und beide sind frei, solange kein Display steckt.
#
# PRÜFEN am Board, sobald es da ist — beides mit dem Messgerät, nicht raten:
#   a) Pinfolge und Versorgungsspannung des OLED-Headers (3,3 V oder 5 V),
#   b) ob der MG90S am 3,3-V-Pegel des ESP32 sauber schaltet. Tut er es nicht,
#      hilft ein Pegelwandler; die Versorgung des Servos gehört ohnehin nicht
#      an das Board (MG90S zieht blockiert ~700 mA), sondern an ein eigenes
#      5-V-Netzteil mit gemeinsamer Masse.
# Weitere unbelegte GPIOs laut rodent.yaml: gpio.2, gpio.4, gpio.12, gpio.13,
# gpio.25 — ob die irgendwo herausgeführt sind, sagt erst das Board.
pwm:
  pwm_hz: 50 # Servo-Takt
  output_pin: gpio.26 # OLED-Header (I2C-SCL), frei ohne Display — PRÜFEN
  enable_pin: NO_PIN
  direction_pin: NO_PIN
  disable_with_s0: false
  s0_with_disable: false
  # Der S-Wert wird zur Impulsbreite: speed_map bildet 0..100 auf den
  # nutzbaren Servoweg ab. Die Endwerte am montierten Stift feinjustieren,
  # dann in PenConfig(down_value=..., up_value=...) übernehmen.
  speed_map: 0=0.000% 100=100.000%
  tool_num: 0

# Kein Laser-Modus: M4 skaliert die Leistung mit der Geschwindigkeit, was für
# einen Servo Unsinn wäre. M3 setzt konstant — genau das, was wir wollen.
Laser:
  laser_mode: false

# ---------------------------------------------------------------------------
# Zweiter Werkzeugkopf (Laser) — bewusst auskommentiert
# ---------------------------------------------------------------------------
#
# FluidNC kann mehrere Spindeln in einer Datei führen; umgeschaltet wird im
# Programm mit `M6 T<nummer>`. Der Wallplotter erzeugt diese Zeile, wenn beim
# Laserkopf `tool_number` gesetzt ist:
#
#   plot bild.svg --toolhead laser --laser-verstanden --laser-smax 1000
#
# Zwei Dinge gehen dabei NICHT:
#
#   1. Beide Köpfe am selben GPIO. FluidNC belegt einen Pin exklusiv; zwei
#      Spindeln auf gpio.25 lassen sich nicht einmal parsen. Der Laser braucht
#      also einen eigenen Ausgang.
#   2. Beide Köpfe an derselben Frequenz. Ein RC-Servo will 50 Hz, ein Laser
#      braucht Kilohertz — FluidNC begrenzt `pwm_hz` einer Laser-Spindel auf
#      1000 bis 100000. Wer den Stift versehentlich an eine `Laser:`-Spindel
#      hängt, bekommt einen Servo, der bei jedem Leerweg in die Nullstellung
#      schnappt und im Betrieb mit dem Vorschub mitflattert: eine
#      rate-adjusted Spindel skaliert S mit der Geschwindigkeit.
#
# Sitzt der Laser physisch auf demselben Pin wie der Servo (Kopf wird
# getauscht), hilft kein M6 — dann braucht es zwei config.yaml und einen
# Neustart dazwischen.
#
# Vor dem Einschalten: `speed_map` gegen das eigene Netzteil prüfen und den
# Endwert als `--laser-smax` übernehmen. Steht dort 255 und die Software
# rechnet mit 1000, kommt viermal zu wenig Leistung heraus — oder umgekehrt.
#
# Laser:
#   laser_mode: true
#   pwm_hz: 5000
#   output_pin: gpio.2        # PRÜFEN, eigener Ausgang, nicht der Servo-Pin
#   enable_pin: NO_PIN        # Freigabe der Laser-PSU, falls vorhanden
#   disable_with_s0: true     # S0 zieht auch die Freigabe — sicherer
#   s0_with_disable: true
#   speed_map: 0=0.000% 1000=100.000%
#   tool_num: 100
#
# coolant:
#   mist_pin: NO_PIN
#   flood_pin: NO_PIN         # Air Assist, angesteuert mit M8 (aus: M9)
#   delay_ms: 500

start:
  must_home: false # Referenziert wird per Anschlag und G92, nicht per $H
  deactivate_parking: true
  check_limits: false

# Ab hier unverändert aus BTTs rodent.yaml übernommen
i2so:
  bck_pin: gpio.22
  data_pin: gpio.21
  ws_pin: gpio.17

spi:
  miso_pin: gpio.19
  mosi_pin: gpio.23
  sck_pin: gpio.18

sdcard:
  cs_pin: gpio.0
  card_detect_pin: NO_PIN
  frequency_hz: 8000000

# Statusleuchten des Boards
status_outputs:
  report_interval_ms: 500
  idle_pin: I2SO.11:low
  run_pin: I2SO.14:low
  alarm_pin: I2SO.3:low

# WLAN dauerhaft im Station-Modus, damit Upload und Web-UI ohne Kabel gehen.
# SSID und Passwort nicht hier eintragen, sondern nach dem Flashen über das
# FluidNC-Terminal setzen — sonst landen sie im Git-Repo:
#   $Sta/SSID=...
#   $Sta/Password=...
#   $WiFi/Mode=STA
#   $Hostname=wandplotter

<?xml version="1.0" encoding="UTF-8"?>
<!-- Testmuster für den ersten End-to-End-Plot: Quadrat, Kreis, Diagonalen.
     Maße in mm, damit sich die Skalierung leicht nachrechnen lässt. -->
<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="200mm"
     viewBox="0 0 200 200">
  <g fill="none" stroke="black" stroke-width="0.5">
    <rect x="10" y="10" width="180" height="180"/>
    <circle cx="100" cy="100" r="80"/>
    <line x1="10" y1="10" x2="190" y2="190"/>
    <line x1="190" y1="10" x2="10" y2="190"/>
    <line x1="100" y1="10" x2="100" y2="190"/>
    <line x1="10" y1="100" x2="190" y2="100"/>
  </g>
</svg>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wallplotter"
version = "0.3.0"
description = "Bild-zu-GCode-Toolchain für einen selbstgebauten V-Plotter an der Kellerwand (FluidNC/GRBL)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["plotter", "polargraph", "vplotter", "fluidnc", "grbl", "gcode", "vpype"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
geometry = ["vpype>=1.14"]
photo = ["pillow>=10.0"]
# Alle vier Bildverfahren rechnen inzwischen selbst, `hatch` seit 0.3.0 auch:
# das Paket `hatched` (letzte Fassung 0.2.0) setzt Shapely 1.x voraus, vpype
# verlangt Shapely 2.x — zusammen installierbar ist das nicht. Der Extra-Name
# bleibt, damit alte Installationsbefehle weiter laufen.
hatch = ["pillow>=10.0"]
web = ["nicegui>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "pyyaml>=6.0"]

[project.scripts]
plot = "wallplotter.cli:main"
wallplotter-calibrate = "wallplotter.calibrate_cli:main"
wallplotter-correct = "wallplotter.correct_cli:main"
wallplotter-doctor = "wallplotter.doctor:main"
wallplotter-kinematics = "wallplotter.kinematics:main"
wallplotter-location = "wallplotter.location_cli:main"
wallplotter-resume = "wallplotter.resume_cli:main"
wallplotter-sim = "wallplotter.simulator:main"

[project.urls]
Repository = "https://github.com/AndreasS964/Wallplotter"

[tool.hatch.build.targets.wheel]
packages = ["src/wallplotter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

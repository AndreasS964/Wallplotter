[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wallplotter"
version = "0.2.0"
description = "Bild-zu-GCode-Toolchain für einen selbstgebauten V-Plotter an der Kellerwand (FluidNC/GRBL)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["plotter", "polargraph", "vplotter", "fluidnc", "grbl", "gcode", "vpype"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
geometry = ["vpype>=1.14"]
# Nur Pillow: stipple, tsp und spiral rechnen selbst. `hatched` steht bewusst
# daneben statt hier drin — es zieht vpype[all], OpenCV, scikit-image und
# matplotlib nach, und dafür soll sich entscheiden, wer wirklich schraffieren
# will.
photo = ["pillow>=10.0"]
hatch = ["pillow>=10.0", "hatched>=0.2"]
# Obergrenze mit Grund: NiceGUI 3 führt bei jedem Seitenaufruf
# `runpy.run_path(sys.argv[0])` aus. Damit das trägt, baut webapp.main()
# die Oberfläche über `ui.run(root=…)` auf. Eine noch neuere Hauptversion
# kann das wieder ändern — deshalb erst prüfen, dann anheben.
web = ["nicegui>=2.0,<4.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "pyyaml>=6.0"]

[project.scripts]
plot = "wallplotter.cli:main"
wallplotter-calibrate = "wallplotter.calibrate_cli:main"
wallplotter-correct = "wallplotter.correct_cli:main"
wallplotter-doctor = "wallplotter.doctor:main"
wallplotter-firmware = "wallplotter.firmware_cli:main"
wallplotter-kinematics = "wallplotter.kinematics:main"
wallplotter-location = "wallplotter.location_cli:main"
wallplotter-resume = "wallplotter.resume_cli:main"
wallplotter-web = "wallplotter.webapp:_cli"

[project.urls]
Repository = "https://github.com/AndreasS964/Wallplotter"

[tool.hatch.build.targets.wheel]
packages = ["src/wallplotter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wallplotter"
version = "0.1.0"
description = "Bild-zu-GCode-Toolchain für einen selbstgebauten V-Plotter an der Kellerwand (FluidNC/GRBL)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["plotter", "polargraph", "vplotter", "fluidnc", "grbl", "gcode", "vpype"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
geometry = ["vpype>=1.14"]
photo = ["vpype[all]>=1.14", "hatched>=0.3"]
web = ["nicegui>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
plot = "wallplotter.cli:main"

[project.urls]
Repository = "https://github.com/AndreasS964/Wallplotter"

[tool.hatch.build.targets.wheel]
packages = ["src/wallplotter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
